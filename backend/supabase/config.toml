# LeadPulse AI — Supabase Configuration
# Reference: https://supabase.com/docs/guides/local-development

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]

[db]
port = 54322

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false

[auth.external.github]
enabled = false

[storage]
file_size_limit = "50MB"

[edge_runtime]
enabled = true

[functions.analyze-business]
verify_jwt = true

[functions.discover-leads]
verify_jwt = true

[functions.generate-outreach]
verify_jwt = true
